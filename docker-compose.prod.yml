# ==============================================================================
# GOT U - HORIZONTALLY SCALABLE PRODUCTION DOCKER-COMPOSE TOPOLOGY
# Demonstrates multi-node API scaling, background worker separation,
# managed PostgreSQL 16, Redis 7, and MinIO/S3 object storage
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Ingress Load Balancer / Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: gotu-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-node-1
      - api-node-2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - gotu-network

  # ----------------------------------------------------------------------------
  # Horizontally Scaled API Pod 1
  # ----------------------------------------------------------------------------
  api-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gotu-prod-api-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gotu_user}:${POSTGRES_PASSWORD:-gotu_secret_password}@postgres:5432/${POSTGRES_DB:-gotu_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-gotu_redis_password}@redis:6379/0
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-gotu_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-gotu_minio_secret}
      - S3_BUCKET_NAME=gotu-processed-media
      - S3_FORCE_PATH_STYLE=true
      - DB_POOL_MAX=20
      - DB_IDLE_TIMEOUT_MS=30000
      - DB_CONN_TIMEOUT_MS=5000
      - DB_STATEMENT_TIMEOUT_MS=30000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gotu-network

  # ----------------------------------------------------------------------------
  # Horizontally Scaled API Pod 2
  # ----------------------------------------------------------------------------
  api-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gotu-prod-api-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gotu_user}:${POSTGRES_PASSWORD:-gotu_secret_password}@postgres:5432/${POSTGRES_DB:-gotu_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-gotu_redis_password}@redis:6379/0
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-gotu_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-gotu_minio_secret}
      - S3_BUCKET_NAME=gotu-processed-media
      - S3_FORCE_PATH_STYLE=true
      - DB_POOL_MAX=20
      - DB_IDLE_TIMEOUT_MS=30000
      - DB_CONN_TIMEOUT_MS=5000
      - DB_STATEMENT_TIMEOUT_MS=30000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gotu-network

  # ----------------------------------------------------------------------------
  # Dedicated Background Video Worker 1
  # ----------------------------------------------------------------------------
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gotu-prod-worker-1
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - WORKER_CONCURRENCY=2
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gotu_user}:${POSTGRES_PASSWORD:-gotu_secret_password}@postgres:5432/${POSTGRES_DB:-gotu_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-gotu_redis_password}@redis:6379/0
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-gotu_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-gotu_minio_secret}
      - S3_BUCKET_NAME=gotu-processed-media
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gotu-network

  # ----------------------------------------------------------------------------
  # Dedicated Background Video Worker 2
  # ----------------------------------------------------------------------------
  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gotu-prod-worker-2
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - WORKER_CONCURRENCY=2
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gotu_user}:${POSTGRES_PASSWORD:-gotu_secret_password}@postgres:5432/${POSTGRES_DB:-gotu_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-gotu_redis_password}@redis:6379/0
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-gotu_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-gotu_minio_secret}
      - S3_BUCKET_NAME=gotu-processed-media
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gotu-network

  # ----------------------------------------------------------------------------
  # Relational Metadata Engine (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gotu-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gotu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gotu_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-gotu_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gotu_user} -d ${POSTGRES_DB:-gotu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotu-network

  # ----------------------------------------------------------------------------
  # In-Memory Cache & BullMQ Queue Coordinator (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gotu-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-gotu_redis_password}", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gotu_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotu-network

  # ----------------------------------------------------------------------------
  # S3-Compatible Distributed Object Storage (MinIO)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: gotu-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gotu_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-gotu_minio_secret}
    volumes:
      - minio_prod_data:/data
    networks:
      - gotu-network

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  gotu-network:
    driver: bridge
